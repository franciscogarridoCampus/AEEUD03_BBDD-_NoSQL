<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTask Tracker</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>DevTask Tracker</h1>
    </header>

    <section class="form-container">
      <div class="form-group">
        <input type="text" id="titulo" placeholder="Título de la tarea">
        <input type="text" id="tecnologia" placeholder="Tecnología (JS, Java...)">
        <select id="estado">
          <option value="true" selected>Pendiente</option>
          <option value="false">Finalizada</option>
        </select>
        <button id="btnGuardar">Guardar tarea</button>
      </div>
    </section>

    <section class="tables-container">
      <div class="tabla">
        <h2>Pendientes</h2>
        <ul id="listaPendientes"></ul>
      </div>

      <div class="tabla">
        <h2>Finalizadas</h2>
        <ul id="listaFinalizadas"></ul>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
